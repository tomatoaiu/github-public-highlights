name: Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Merged release commit SHA (leave empty for the first release)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    if: >-
      ${{
        github.repository == 'tomatoaiu/github-public-highlights' &&
        github.actor == github.repository_owner &&
        (
          (
            github.event_name == 'workflow_dispatch'
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            startsWith(
              github.event.pull_request.head.ref,
              'release-please--branches--main'
            ) &&
            contains(
              github.event.pull_request.labels.*.name,
              'autorelease: pending'
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    env:
      RELEASE_SHA: >-
        ${{
          inputs.release_sha ||
          github.event.pull_request.merge_commit_sha ||
          github.sha
        }}
    outputs:
      release_pr_number: ${{ steps.metadata.outputs.release_pr_number }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { version } = JSON.parse(readFileSync("package.json", "utf8"))
            const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
            if (!pattern.test(version)) {
              throw new Error("Invalid package version: " + version)
            }
            const parts = version.split(".").map(Number)
            if (parts.every((part) => part === 0) || parts.some((part) => part > 65535)) {
              throw new Error("Unsupported Chrome extension version: " + version)
            }
            process.stdout.write(version)
          ')
          manifest_version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const manifest = JSON.parse(
              readFileSync(".release-please-manifest.json", "utf8"),
            )
            process.stdout.write(manifest["."] ?? "")
          ')

          if [[ "$version" != "$manifest_version" ]]; then
            echo "package.json and release manifest versions do not match." >&2
            exit 1
          fi

          release_sha=$(git rev-parse HEAD)
          if [[ "$release_sha" != "$RELEASE_SHA" ]]; then
            echo "Checked out ${release_sha}, expected ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release commit is not on main." >&2
            exit 1
          fi

          release_pr_number="${PULL_REQUEST_NUMBER:-}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_RELEASE_SHA" ]]; then
            release_pr_number=$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/pulls" |
                jq -er \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg sha "$release_sha" '
                    [
                      .[]
                      | select(
                          .merged_at != null
                          and .merge_commit_sha == $sha
                          and .base.ref == "main"
                          and .head.repo.full_name == $repository
                          and .user.login == "github-actions[bot]"
                          and (
                            .head.ref
                            | startswith("release-please--branches--main")
                          )
                          and (
                            [.labels[].name]
                            | index("autorelease: pending") != null
                          )
                        )
                    ]
                    | if length == 1 then
                        .[0].number
                      else
                        error(
                          "Expected one pending Release Please PR, found \(length)"
                        )
                      end
                  '
            )
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$MANUAL_RELEASE_SHA" ]]; then
            release_count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=1" \
              --jq 'length')
            if [[ "$release_count" != "0" ]]; then
              echo "A release SHA is required after the first release." >&2
              exit 1
            fi
          fi

          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} exists without a published release." >&2
            exit 1
          fi

          {
            echo "release_pr_number=${release_pr_number}"
            echo "release_sha=${release_sha}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "zip_name=github-public-highlights-${version}-chrome.zip"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Package extension
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          set -euo pipefail

          pnpm zip
          zip_path=".output/${ZIP_NAME}"
          if [[ ! -f "$zip_path" ]]; then
            echo "Expected ZIP was not generated: ${zip_path}" >&2
            exit 1
          fi

          zip_version=$(unzip -p "$zip_path" manifest.json | jq -r '.version')
          if [[ "$zip_version" != "$VERSION" ]]; then
            echo "ZIP manifest version ${zip_version} does not match ${VERSION}." >&2
            exit 1
          fi

          checksum=$(sha256sum "$zip_path" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$checksum" "$ZIP_NAME" \
            > .output/SHA256SUMS
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .output/${{ steps.metadata.outputs.zip_name }}
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: >-
          gh attestation verify ".output/${ZIP_NAME}"
          --repo "$GITHUB_REPOSITORY"
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: |
            .output/${{ steps.metadata.outputs.zip_name }}
            .output/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-assets
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum --check SHA256SUMS
          gh attestation verify "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists." >&2
            exit 1
          fi
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "release-assets/${ZIP_NAME}#Chrome extension" \
            "release-assets/SHA256SUMS#SHA-256 checksums" \
            --fail-on-no-commits \
            --generate-notes \
            --target "$RELEASE_SHA"

          verified=false
          for attempt in 1 2 3 4 5; do
            if gh release verify "$TAG"; then
              verified=true
              break
            fi
            if [[ "$attempt" != "5" ]]; then
              sleep 2
            fi
          done
          if [[ "$verified" != "true" ]]; then
            echo "Release attestation verification failed." >&2
            exit 1
          fi

          gh release verify-asset "$TAG" \
            "release-assets/${ZIP_NAME}"
      - name: Mark release pull request as published
        if: needs.build.outputs.release_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.release_pr_number }}
        run: >-
          gh pr edit "$PR_NUMBER"
          --remove-label "autorelease: pending"
